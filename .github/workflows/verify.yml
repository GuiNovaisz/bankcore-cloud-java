name: Foundation verification
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    name: Java and resilience contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-test-results
          path: '**/target/surefire-reports/*.xml'
  distributed:
    name: Distributed financial and failure proofs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: node scripts/configure.mjs
      - run: docker compose --parallel 1 up -d --build --wait --wait-timeout 240
      - run: node tests/e2e.mjs
      - run: node scripts/load.mjs
      - name: Collect safe diagnostics
        if: always()
        run: |
          docker compose ps > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distributed-evidence
          path: |
            artifacts/*results.json
            artifacts/load-summary.json
            artifacts/trace.json
            artifacts/trace-id.txt
            artifacts/compose-status.txt
            artifacts/compose.log
      - if: always()
        run: docker compose down -v
  terraform:
    name: Terraform and IaC security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/sandbox init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/environments/sandbox validate
      - run: docker run --rm -v "$PWD:/src:ro" bridgecrew/checkov:3.4.6 -d /src/infra/terraform --framework terraform --config-file /src/.checkov.yml --compact
  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
