resolver 127.0.0.11 valid=5s ipv6=off;
upstream account { zone account 64k; server account-service:8080 resolve; }
upstream ledger { zone ledger 64k; server ledger-service:8080 resolve; }
upstream transfer { zone transfer 64k; server transfer-service:8080 resolve; }
upstream projection { zone projection 64k; server projection-worker:8080 resolve; }
server {
 listen 8080;
 server_tokens off;
 client_max_body_size 16k;
 proxy_connect_timeout 1s;
 proxy_read_timeout 5s;
 proxy_send_timeout 5s;
 location /account/ { proxy_pass http://account/; }
 location /ledger/ { proxy_pass http://ledger/; }
 location /transfer/ { proxy_pass http://transfer/; }
 location /projection/ { proxy_pass http://projection/; }
 # Operator credentials cannot call /internal endpoints, enforced independently by every service.
 location = /health { return 200 'edge alive'; add_header Content-Type text/plain; }
}
