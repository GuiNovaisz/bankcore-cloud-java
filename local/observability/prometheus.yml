global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: bankcore
    metrics_path: /actuator/prometheus
    basic_auth:
      username: operator
      password_file: /etc/prometheus/auth
    static_configs:
      - targets: [account-service:8080, ledger-service:8080, transfer-service:8080, projection-worker:8080]

